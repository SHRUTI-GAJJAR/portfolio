    <!--
      Applied before first paint so a returning visitor who chose light mode
      never sees a flash of the dark theme while React boots.
      Mirrors the logic in src/hooks/useTheme.js.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme");
          var prefersLight = window.matchMedia(
            "(prefers-color-scheme: light)"
          ).matches;
          var light = stored ? stored === "light" : prefersLight;
          document.documentElement.dataset.theme = light ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
